<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · Gastos Familiares</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-top: 3px solid var(--color-accent);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2rem 1.8rem;
      width: 100%;
      max-width: 380px;
    }
    .login-card h1 {
      font-family: var(--font-display);
      font-size: 1.4rem;
      color: var(--color-primary-dark);
      margin-bottom: 0.3rem;
      text-align: center;
    }
    .login-card p.sub {
      text-align: center;
      color: var(--color-ink-light);
      font-size: 0.85rem;
      margin-bottom: 1.4rem;
    }
    .login-swap {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--color-ink-light);
    }
    .login-swap a { color: var(--color-primary); font-weight: 600; cursor: pointer; text-decoration: underline; }
    .login-msg {
      display: none;
      font-size: 0.82rem;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      margin-bottom: 1rem;
    }
    .login-msg.show { display: block; }
    .login-msg--error { background: #fde2df; color: #8a2e22; }
    .login-msg--ok { background: #e1efe3; color: #2f5c3a; }
  </style>
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">
      <h1>💰 Gastos Familiares</h1>
      <p class="sub">Inicia sesión para ver tus gastos</p>

      <div class="login-msg" id="loginMsg"></div>

      <form id="formLogin" class="form-gasto">
        <div class="form-group">
          <label for="loginEmail">Correo electrónico</label>
          <input type="email" id="loginEmail" required placeholder="tucorreo@ejemplo.com" />
        </div>
        <div class="form-group">
          <label for="loginPassword">Contraseña</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn--primary" id="btnLogin">Entrar</button>
        </div>
      </form>
      <p class="login-swap">¿No tienes cuenta? <a id="linkRegistro">Regístrate aquí</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script>
    const formLogin = document.getElementById("formLogin");
    const loginMsg = document.getElementById("loginMsg");
    const btnLogin = document.getElementById("btnLogin");
    const linkRegistro = document.getElementById("linkRegistro");
    let modoRegistro = false;

    function mostrarMsg(texto, ok) {
      loginMsg.textContent = texto;
      loginMsg.className = "login-msg show " + (ok ? "login-msg--ok" : "login-msg--error");
    }

    linkRegistro.addEventListener("click", () => {
      modoRegistro = !modoRegistro;
      btnLogin.textContent = modoRegistro ? "Crear cuenta" : "Entrar";
      linkRegistro.parentElement.firstChild.textContent = modoRegistro ? "¿Ya tienes cuenta? " : "¿No tienes cuenta? ";
      linkRegistro.textContent = modoRegistro ? "Inicia sesión" : "Regístrate aquí";
    });

    formLogin.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      btnLogin.disabled = true;

      // Se llama directo a Supabase (no se usa auth.js aquí, para evitar
      // el bucle de redirección que causaría su onAuthStateChange).
      const resultado = modoRegistro
        ? await supabase.auth.signUp({ email, password })
        : await supabase.auth.signInWithPassword({ email, password });

      if (resultado.error) {
        mostrarMsg(modoRegistro ? resultado.error.message : "Correo o contraseña incorrectos", false);
        btnLogin.disabled = false;
      } else {
        window.location.href = "index.html";
      }
    });
  </script>
</body>
</html>
